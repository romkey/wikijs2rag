# Development: runs the ingester from your working tree, with the dev
# dependencies installed, against a local Qdrant. Embeddings come from the tei
# service (Hugging Face Text Embeddings Inference) unless OPENAI_BASE_URL points
# at another OpenAI-compatible server.
#
#   cp .env.example .env              # then edit it
#   docker compose up --build         # Qdrant dashboard: http://localhost:6333/dashboard
#   docker compose run --rm query "how do I reset my password?"
#   docker compose run --rm app bash  # a shell with everything installed
#
# Restart the app (docker compose restart app) to pick up code changes.
# Tests, lint and production have their own compose files:
#
#   docker compose -f docker-compose.test.yaml run --rm test
#   docker compose -f docker-compose.lint.yaml run --rm lint
#   docker compose -f docker-compose.prod.yaml up -d

x-app: &app
  build:
    context: .
    target: dev
  env_file:
    - path: .env
      required: false
  environment:
    QDRANT_HOST: qdrant
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://tei/v1}
  extra_hosts:
    - "host.docker.internal:host-gateway"  # reach an embeddings server on the host
  volumes:
    - .:/app
    - uv-cache:/root/.cache/uv
  depends_on:
    qdrant:
      condition: service_healthy
    tei:
      condition: service_healthy
      required: false  # not running when the "tei" profile is off

services:
  app:
    <<: *app
    # uv run re-syncs /venv if pyproject.toml or uv.lock changed.
    command: uv run --locked wikijs2rag

  # Command-line search; only runs when asked (docker compose run --rm query ...).
  query:
    <<: *app
    profiles: [tools]
    entrypoint: ["uv", "run", "--locked", "wikijs2rag-query"]

  # Hugging Face Text Embeddings Inference: serves EMBEDDING_MODEL at
  # http://tei/v1 inside this network and on host port TEI_PORT. Runs when
  # COMPOSE_PROFILES includes "tei", as .env.example sets it; drop that to use
  # another embeddings server. The first start downloads the model into tei_data.
  # On ARM (Apple Silicon, Graviton) set TEI_IMAGE to the cpu-arm64-* image.
  tei:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4}
    profiles: [tei]
    # Warm-up memory grows with the square of max-batch-tokens: about 1.5 GB at
    # 2048, 3 GB at 4096, over 8 GB at 8192. Longer inputs are truncated.
    command:
      - --model-id
      - ${EMBEDDING_MODEL:-nomic-ai/modernbert-embed-base}
      - --max-batch-tokens
      - ${TEI_MAX_BATCH_TOKENS:-2048}
      - --auto-truncate
    ports:
      - "${TEI_PORT:-8080}:80"
    volumes:
      - tei_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s  # model download on first start

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "${QDRANT_REST_PORT:-6333}:6333"  # REST / dashboard
      - "${QDRANT_GRPC_PORT:-6334}:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The Qdrant image has no curl or wget; probe /readyz with bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  uv-cache:
  qdrant_data:
  tei_data:
