[project]
name = "wikijs2rag"
version = "1.2.3"
description = "Ingest public Wiki.js pages into a Qdrant vector store for RAG, with Ollama embeddings."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Romkey" }]
# Keep in step with .python-version and the Dockerfile's python image.
requires-python = ">=3.15"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "beautifulsoup4>=4.15.0",  # HTML scraping fallback for pages GraphQL won't serve
  "httpx>=0.28.1",           # Wiki.js GraphQL and Ollama HTTP APIs
  "qdrant-client>=1.20.0",   # vector store
]

[project.urls]
Homepage = "https://github.com/romkey/wikijs2rag"
Changelog = "https://github.com/romkey/wikijs2rag/blob/main/CHANGELOG.md"
Issues = "https://github.com/romkey/wikijs2rag/issues"

[project.scripts]
wikijs2rag = "wikijs2rag.__main__:main"
wikijs2rag-query = "wikijs2rag.query:main"

[dependency-groups]
dev = [
  "mypy>=2.4.1",
  "pytest>=9.2.0",
  "pytest-cov>=7.1.0",
  "respx>=0.23.1",  # mocks httpx at the transport boundary
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # import order
  "N",            # naming
  "UP",           # modern syntax for requires-python
  "B",            # likely bugs
  "S",            # security
  "C4", "SIM", "RET", "PTH",
  "DTZ",          # timezone-aware datetimes
  "T20",          # no print(); use logging
  "LOG", "G",     # logging calls
  "PT",           # pytest style
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works
"scripts/**" = ["T20"]  # command-line tools print

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report=term-missing", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = [
  "error",
  # Expected: tests use Qdrant's in-memory mode, which ignores payload indexes.
  "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]

[tool.coverage.run]
source = ["wikijs2rag"]
branch = true

[tool.coverage.report]
fail_under = 80
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
