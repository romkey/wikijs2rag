# Production: runs the released image from ghcr.io next to Qdrant.
# Configure it in .env next to this file (see .env.example and
# docs/configuration.md). Embeddings come from the tei service (Hugging Face
# Text Embeddings Inference) unless OPENAI_BASE_URL points elsewhere.
#
#   docker compose -f docker-compose.prod.yaml up -d
#   APP_VERSION=1.2.3 docker compose -f docker-compose.prod.yaml up -d   # pin a release
#   docker compose -f docker-compose.prod.yaml run --rm query "door code"
#   docker compose -f docker-compose.prod.yaml build   # build the image locally instead

x-app: &app
  image: ghcr.io/romkey/wikijs2rag:${APP_VERSION:-latest}
  build:
    context: .
    target: production
  env_file:
    - path: .env
      required: false
  environment:
    QDRANT_HOST: qdrant
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://tei/v1}
  extra_hosts:
    - "host.docker.internal:host-gateway"  # reach an embeddings server on the host
  depends_on:
    qdrant:
      condition: service_healthy
    tei:
      condition: service_healthy
      required: false  # not running when the "tei" profile is off
  # Least privilege: nothing to write but /tmp, no capabilities.
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  # Ingests on start, then every POLL_INTERVAL_SECONDS. It's a worker with no
  # port, so there's no /healthz to probe: it exits non-zero if Qdrant or the
  # wiki is unreachable, and Docker restarts it.
  app:
    <<: *app
    restart: unless-stopped

  # Command-line search; only runs when asked.
  query:
    <<: *app
    profiles: [tools]
    entrypoint: ["wikijs2rag-query"]

  # Hugging Face Text Embeddings Inference: serves EMBEDDING_MODEL at
  # http://tei/v1 inside this network and on host port TEI_PORT. Runs when
  # COMPOSE_PROFILES includes "tei", as .env.example sets it; drop that to use
  # another embeddings server. The first start downloads the model into tei_data.
  # On ARM (Apple Silicon, Graviton) set TEI_IMAGE to the cpu-arm64-* image.
  tei:
    image: ${TEI_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4}
    profiles: [tei]
    # Warm-up memory grows with the square of max-batch-tokens: about 1.5 GB at
    # 2048, 3 GB at 4096, over 8 GB at 8192. Longer inputs are truncated.
    command:
      - --model-id
      - ${EMBEDDING_MODEL:-nomic-ai/modernbert-embed-base}
      - --max-batch-tokens
      - ${TEI_MAX_BATCH_TOKENS:-2048}
      - --auto-truncate
    ports:
      - "${TEI_PORT:-8080}:80"
    volumes:
      - tei_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s  # model download on first start
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    ports:
      - "${QDRANT_REST_PORT:-6333}:6333"  # REST / dashboard, for your RAG apps
      - "${QDRANT_GRPC_PORT:-6334}:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The Qdrant image has no curl or wget; probe /readyz with bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  qdrant_data:
  tei_data:
